
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Member | Gym Management</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
        }

        /* NAVBAR */

        .navbar {
            height: 75px;
            padding: 0 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;

            background: rgba(15, 23, 42, 0.95);

            border-bottom: 1px solid rgba(255,255,255,0.08);

            box-shadow: 0 5px 20px rgba(0,0,0,0.25);
        }

        .logo {
            font-size: 25px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .logo span {
            color: #38bdf8;
        }

        .nav-right {
            color: #94a3b8;
            font-size: 14px;
        }

        /* MAIN */

        .container {
            width: 90%;
            max-width: 850px;
            margin: 50px auto;
        }

        .form-card {
            background: rgba(255,255,255,0.07);

            backdrop-filter: blur(15px);

            border: 1px solid rgba(255,255,255,0.1);

            border-radius: 22px;

            padding: 40px;

            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        .heading {
            text-align: center;
            margin-bottom: 35px;
        }

        .heading .icon {
            font-size: 45px;
            margin-bottom: 10px;
        }

        .heading h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .heading h1 span {
            color: #38bdf8;
        }

        .heading p {
            color: #94a3b8;
            font-size: 15px;
        }

        /* FORM */

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 22px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 600;
        }

        input,
        select {
            width: 100%;

            padding: 14px 15px;

            border-radius: 10px;

            border: 1px solid rgba(255,255,255,0.12);

            outline: none;

            background: rgba(15,23,42,0.75);

            color: #f8fafc;

            font-size: 15px;

            transition: 0.3s;
        }

        input:focus,
        select:focus {
            border-color: #38bdf8;

            box-shadow: 0 0 0 3px rgba(56,189,248,0.12);
        }

        input[readonly] {
            color: #94a3b8;
            cursor: not-allowed;
        }

        select option {
            background: #0f172a;
            color: white;
        }

        /* BUTTONS */

        .button-area {
            margin-top: 35px;

            display: flex;

            justify-content: center;

            gap: 15px;

            flex-wrap: wrap;
        }

        .btn {
            text-decoration: none;

            border: none;

            padding: 13px 25px;

            border-radius: 10px;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.3s;
        }

        .update-btn {
            background: #38bdf8;
            color: #082f49;
        }

        .update-btn:hover {
            background: #0ea5e9;

            transform: translateY(-2px);

            box-shadow: 0 8px 20px rgba(14,165,233,0.25);
        }

        .back-btn {
            background: rgba(255,255,255,0.08);

            color: #cbd5e1;

            border: 1px solid rgba(255,255,255,0.1);
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.14);

            transform: translateY(-2px);
        }

        /* MEMBER ID BADGE */

        .member-id {
            display: inline-block;

            margin-top: 15px;

            padding: 6px 14px;

            border-radius: 20px;

            background: rgba(56,189,248,0.12);

            color: #38bdf8;

            font-size: 13px;

            font-weight: 600;
        }

        /* FOOTER */

        footer {
            text-align: center;

            margin-top: 40px;

            padding-bottom: 25px;

            color: #64748b;

            font-size: 13px;
        }

        /* RESPONSIVE */

        @media (max-width: 700px) {

            .navbar {
                padding: 0 5%;
            }

            .nav-right {
                display: none;
            }

            .container {
                width: 94%;
                margin: 30px auto;
            }

            .form-card {
                padding: 25px 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .heading h1 {
                font-size: 27px;
            }

            .button-area {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                text-align: center;
            }
        }

    </style>

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar">

    <div class="logo">
        Gym<span>Os</span>
    </div>

    <div class="nav-right">
        Gym Management System
    </div>

</nav>


<!-- MAIN -->

<div class="container">

    <div class="form-card">


        <!-- HEADING -->

        <div class="heading">

            <div class="icon">
                ✏️
            </div>

            <h1>
                Edit <span>Member</span>
            </h1>

            <p>
                Update the member's information below
            </p>

            <div class="member-id">
                Member ID: <span th:text="${member.id}"></span>
            </div>

        </div>


        <!-- EDIT FORM -->

        <form action="/member/save"
              method="post">


            <!-- IMPORTANT:
                 Existing ID is sent back to Spring Boot.
                 This allows JPA to UPDATE the existing member.
            -->

            <input type="hidden"
                   name="id"
                   th:value="${member.id}">


            <div class="form-grid">


                <!-- NAME -->

                <div class="form-group">

                    <label>
                        Full Name
                    </label>

                    <input type="text"
                           name="name"
                           th:value="${member.name}"
                           placeholder="Enter full name"
                           required>

                </div>


                <!-- PHONE -->

                <div class="form-group">

                    <label>
                        Phone Number
                    </label>

                    <input type="tel"
                           name="phone"
                           th:value="${member.phone}"
                           placeholder="Enter phone number"
                           required>

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label>
                        Email Address
                    </label>

                    <input type="email"
                           name="email"
                           th:value="${member.email}"
                           placeholder="Enter email address"
                           required>

                </div>


                <!-- MEMBERSHIP -->

                <div class="form-group">

                    <label>
                        Membership Type
                    </label>

                    <select name="membershipType"
                            required>

                        <option value="">
                            Select Membership
                        </option>

                        <option value="Monthly"
                                th:selected="${member.membershipType == 'Monthly'}">
                            Monthly
                        </option>

                        <option value="Quarterly"
                                th:selected="${member.membershipType == 'Quarterly'}">
                            Quarterly
                        </option>

                        <option value="Half-Yearly"
                                th:selected="${member.membershipType == 'Half-Yearly'}">
                            Half-Yearly
                        </option>

                        <option value="Yearly"
                                th:selected="${member.membershipType == 'Yearly'}">
                            Yearly
                        </option>

                    </select>

                </div>


                <!-- FEES -->

                <div class="form-group">

                    <label>
                        Membership Fees (₹)
                    </label>

                    <input type="number"
                           name="fees"
                           th:value="${member.fees}"
                           placeholder="Enter fees"
                           min="0"
                           required>

                </div>


                <!-- ID -->

                <div class="form-group">

                    <label>
                        Member ID
                    </label>

                    <input type="text"
                           th:value="${member.id}"
                           readonly>

                </div>


            </div>


            <!-- BUTTONS -->

            <div class="button-area">

                <a href="/member/list"
                   class="btn back-btn">

                    ← Back to Members

                </a>


                <button type="submit"
                        class="btn update-btn">

                    ✓ Update Member

                </button>

            </div>


        </form>


    </div>

</div>


<!-- FOOTER -->

<footer>

    © 2026 FitZone Gym Management System

</footer>


</body>

</html>
