<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>


<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Add Member | GymOS</title>

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        background: #0b1120;
        color: white;
        min-height: 100vh;
    }

    /* NAVBAR */

    .navbar {
        height: 72px;
        padding: 0 7%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(11,17,32,.96);
        border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .logo {
        font-size: 24px;
        font-weight: 800;
    }

    .logo span {
        color: #22c55e;
    }

    .nav-links {
        display: flex;
        gap: 28px;
        align-items: center;
    }

    .nav-links a {
        color: #cbd5e1;
        text-decoration: none;
        font-size: 15px;
    }

    .nav-links a:hover {
        color: #22c55e;
    }

    .nav-search {
        background: #22c55e;
        color: #06100a !important;
        padding: 10px 17px;
        border-radius: 8px;
        font-weight: 700;
    }

    /* PAGE */

    .page {
        width: 86%;
        max-width: 1000px;
        margin: 60px auto;
    }

    .page-header {
        margin-bottom: 30px;
    }

    .badge {
        display: inline-block;
        padding: 8px 14px;
        border: 1px solid rgba(34,197,94,.35);
        border-radius: 30px;
        color: #4ade80;
        background: rgba(34,197,94,.08);
        font-size: 13px;
        font-weight: bold;
        margin-bottom: 18px;
    }

    .page-header h1 {
        font-size: 42px;
        margin-bottom: 10px;
    }

    .page-header h1 span {
        color: #22c55e;
    }

    .page-header p {
        color: #94a3b8;
    }

    /* FORM CARD */

    .form-card {
        background: #111827;
        border: 1px solid #1f2937;
        border-radius: 18px;
        padding: 40px;
        box-shadow: 0 20px 50px rgba(0,0,0,.25);
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 25px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
    }

    .form-group.full {
        grid-column: 1 / -1;
    }

    label {
        color: #cbd5e1;
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 9px;
    }

    input,
    select {
        width: 100%;
        padding: 14px 15px;
        background: #0b1120;
        color: white;
        border: 1px solid #334155;
        border-radius: 9px;
        outline: none;
        font-size: 15px;
    }

    input:focus,
    select:focus {
        border-color: #22c55e;
        box-shadow: 0 0 0 3px rgba(34,197,94,.08);
    }

    input::placeholder {
        color: #64748b;
    }

    .actions {
        margin-top: 35px;
        display: flex;
        gap: 15px;
    }

    .save-btn {
        border: none;
        background: #22c55e;
        color: #06100a;
        padding: 14px 25px;
        border-radius: 9px;
        font-weight: 800;
        cursor: pointer;
        font-size: 15px;
    }

    .save-btn:hover {
        background: #4ade80;
        transform: translateY(-2px);
    }

    .cancel-btn {
        text-decoration: none;
        color: #cbd5e1;
        border: 1px solid #334155;
        padding: 14px 25px;
        border-radius: 9px;
        font-weight: 700;
    }

    .cancel-btn:hover {
        border-color: #22c55e;
        color: #4ade80;
    }

    footer {
        text-align: center;
        padding: 30px;
        color: #64748b;
        border-top: 1px solid #1f2937;
        margin-top: 70px;
        font-size: 13px;
    }

    @media(max-width:700px) {

        .nav-links a:not(.nav-search) {
            display: none;
        }

        .page {
            width: 92%;
            margin: 40px auto;
        }

        .form-card {
            padding: 25px;
        }

        .form-grid {
            grid-template-columns: 1fr;
        }

        .form-group.full {
            grid-column: auto;
        }

        .page-header h1 {
            font-size: 32px;
        }

    }
    
    .error {
    display: block;
    margin-top: 6px;
    color: #ef4444;
    font-size: 13px;
    font-weight: 600;
}

</style>


</head>

<body>

<!-- NAVBAR -->

<nav class="navbar">


<div class="logo">
    Gym<span>OS</span>
</div>

<div class="nav-links">

    <a href="/home">
        Home
    </a>

    <a href="/member/list">
        Members
    </a>

    <a href="/member/add">
        Add Member
    </a>

    <a href="/member/search" class="nav-search">
        🔍 Search Member
    </a>

</div>


</nav>

<!-- PAGE -->

<div class="page">

<div class="page-header">

    <div class="badge">
        👤 MEMBER REGISTRATION
    </div>

    <h1>
        Add <span>New Member.</span>
    </h1>

    <p>
        Register a new gym member and keep their membership
        information organized.
    </p>

</div>


<!-- FORM -->

<div class="form-card">

    <form action="/member/save"
    	  th:object="${member}"
          method="post">

        <div class="form-grid">

            <div class="form-group">

                <label>
                    Member Name
                </label>

                <input type="text"
                       th:field="*{name}"
                       placeholder="Enter member name"
                       >
                       
                                <small class="error"
           th:if="${#fields.hasErrors('name')}"
           th:errors="*{name}">
   			 </small> 

            </div>


            <div class="form-group">

                <label>
                    Phone Number
                </label>

                <input type="text"
                       th:field="*{phone}"
                       placeholder="Enter phone number"
                       >
                  
                   <small class="error"
           th:if="${#fields.hasErrors('phone')}"
           th:errors="*{phone}">
   			 </small>

            </div>


            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input type="email"
                       th:field="*{email}"
                       placeholder="Enter email address">
                  
                   <small class="error"
           th:if="${#fields.hasErrors('email')}"
           th:errors="*{email}">
   			 </small>

            </div>


            <div class="form-group">

                <label>
                    Membership Type
                </label>

               <select th:field="*{membershipType}">

                    <option value="">
                        Select membership
                    </option>

                    <option value="Monthly">
                        Monthly
                    </option>

                    <option value="Quarterly">
                        Quarterly
                    </option>

                    <option value="Half-Yearly">
                        Half-Yearly
                    </option>

                    <option value="Yearly">
                        Yearly
                    </option>

                </select>
                
                
                   <small class="error"
           th:if="${#fields.hasErrors('membershipType')}"
           th:errors="*{membershipType}">
   			 </small>

            </div>


            <div class="form-group full">

                <label>
                    Membership Fees
                </label>

                <input type="number"
                       th:field="*{fees}"
                       placeholder="Enter membership fees"
                       step="0.01"
                      >
                       
                       
                   <small class="error"
           th:if="${#fields.hasErrors('fees')}"
           th:errors="*{fees}">
   			 </small>

            </div>

        </div>


        <div class="actions">

            <button type="submit"
                    class="save-btn">

                ✓ Save Member

            </button>

            <a href="/home"
               class="cancel-btn">

                Cancel

            </a>

        </div>

    </form>

</div>


</div>

<footer>


© 2026 GymOS — Gym Management System


</footer>

</body>

</html>
